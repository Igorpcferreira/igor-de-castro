<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Prévia de compartilhamento — site principal</title>
  <!-- Fonte da imagem public/og-image.jpg. Renderize em 1200x630 com docs/render-og.cjs. -->
  <style>
    @font-face { font-family: "JetBrains Mono"; src: url("../../../public/links/assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
    @font-face { font-family: "Space Grotesk"; src: url("../../../public/links/assets/fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #020409; }
    body { position: relative; font-family: "Space Grotesk", sans-serif; color: #f4fff8; -webkit-font-smoothing: antialiased; }
    canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
    .shade { position: absolute; inset: 0; background: linear-gradient(to right, rgb(2 4 9 / .86) 0%, rgb(2 4 9 / .58) 50%, rgb(2 4 9 / .25) 78%); }
    .frame { position: absolute; inset: 60px 70px 60px 76px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; align-items: center; }
    .copy { display: flex; flex-direction: column; }
    .kicker { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 13px; font: 600 17px "JetBrains Mono", monospace; color: #52ff7d; background: rgb(2 4 9 / .6); border: 1px solid rgb(82 255 125 / .35); border-radius: 999px; }
    .kicker i { width: 10px; height: 10px; border-radius: 50%; background: #52ff7d; box-shadow: 0 0 12px #52ff7d; }
    h1 { margin: 26px 0 0; font: 700 108px/.88 "Space Grotesk", sans-serif; letter-spacing: -.055em; }
    h1 span { display: block; }
    .lead { margin: 24px 0 0; max-width: 24ch; font: 600 32px/1.22 "Space Grotesk", sans-serif; letter-spacing: -.02em; }
    .lead b { color: #52ff7d; white-space: nowrap; }
    .badges { display: flex; gap: 12px; margin-top: 30px; }
    .badges span { display: grid; gap: 2px; padding: 12px 18px; background: rgb(6 14 10 / .82); border: 1px solid rgb(165 255 190 / .16); border-radius: 22px; }
    .badges b { font: 700 30px/1 "Space Grotesk", sans-serif; letter-spacing: -.04em; color: #52ff7d; }
    .badges small { font: 500 15px "Space Grotesk", sans-serif; color: #7aa892; }
    .node { position: relative; width: 300px; height: 300px; justify-self: center; }
    .ring { position: absolute; inset: 0; padding: 6px; background: conic-gradient(from 0deg, #52ff7d, #35c8ff, #52ff7d); border-radius: 50%; box-shadow: 0 0 90px -10px rgb(82 255 125 / .75); }
    .ring img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; border: 6px solid #020409; border-radius: 50%; }
    .orbit { position: absolute; inset: -26px; border: 2px dashed rgb(82 255 125 / .35); border-radius: 50%; }
    .orbit i { position: absolute; width: 14px; height: 14px; background: #52ff7d; border-radius: 50%; box-shadow: 0 0 16px #52ff7d; }
    .orbit i:nth-child(1) { top: -7px; left: calc(50% - 7px); }
    .orbit i:nth-child(2) { bottom: 12%; left: 3%; }
    .orbit i:nth-child(3) { right: 3%; bottom: 12%; background: #35c8ff; box-shadow: 0 0 16px #35c8ff; }
    .trophy { position: absolute; bottom: -18px; left: 50%; display: flex; align-items: center; gap: 12px; padding: 10px 20px 10px 10px; white-space: nowrap; background: rgb(14 22 15 / .96); border: 1px solid rgb(255 196 107 / .55); border-radius: 999px; box-shadow: 0 20px 40px -16px #000, 0 0 34px -10px rgb(255 196 107 / .6); transform: translateX(-50%); }
    .trophy b { display: grid; place-items: center; width: 44px; height: 44px; background: linear-gradient(135deg, #ffe7ad, #ffc46b); border-radius: 50%; }
    .trophy svg { width: 24px; height: 24px; fill: #2a1800; }
    .trophy small { display: block; font: 600 14px "JetBrains Mono", monospace; color: #ffc46b; }
    .trophy strong { display: block; font: 600 18px "Space Grotesk", sans-serif; }
    .url { position: absolute; right: 70px; bottom: 34px; font: 500 19px "JetBrains Mono", monospace; color: #7aa892; }
  </style>
</head>
<body>
  <canvas class="neural"></canvas>
  <div class="shade"></div>
  <div class="frame">
    <div class="copy">
      <span class="kicker"><i></i>Cofundador da Kyber Tech</span>
      <h1><span>Igor</span><span>de Castro</span></h1>
      <p class="lead">Sites, sistemas e automações <b>sob medida</b> para o seu negócio.</p>
      <div class="badges">
        <span><b>4+</b><small>anos em tecnologia</small></span>
        <span><b>11</b><small>projetos no ar</small></span>
        <span><b>950+</b><small>testes automatizados</small></span>
      </div>
    </div>
    <div class="node">
      <span class="orbit"><i></i><i></i><i></i></span>
      <span class="ring"><img src="../../../public/links/assets/igor-poster.webp" alt=""></span>
      <span class="trophy"><b><svg viewBox="0 0 24 24"><path d="m21,4h-3v-1c0-.55-.45-1-1-1H7c-.55,0-1,.45-1,1v1h-3c-.55,0-1,.45-1,1v3c0,4.29,1.79,6.88,4.81,6.99.88,1.52,2.4,2.62,4.19,2.92v2.09h-3v2h8v-2h-3v-2.09c1.79-.3,3.32-1.4,4.19-2.92,3.01-.11,4.81-2.7,4.81-6.99v-3c0-.55-.45-1-1-1ZM4,8v-2h2v6c0,.28.03.56.06.83-1.84-.71-2.06-3.52-2.06-4.83Zm12,4c0,2.21-1.79,4-4,4s-4-1.79-4-4V4h8v8Zm4-4c0,1.31-.22,4.12-2.06,4.83.04-.27.06-.55.06-.83v-6h2v2Z"/></svg></b><span><small>Conquista desbloqueada</small><strong>Do suporte a cofundador</strong></span></span>
    </div>
  </div>
  <p class="url">igordecastro.com.br</p>
  <script src="../../../public/links/neural.js"></script>
  <script>window.mountNeural(document.querySelector('.neural'));</script>
</body>
</html>
