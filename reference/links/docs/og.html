<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia de compartilhamento</title><link rel="stylesheet" href="../styles.css"><style>html,body{width:1200px;height:630px;overflow:hidden}body{padding:65px 78px;background-image:radial-gradient(ellipse at 85% 30%,var(--halo),transparent 60%)}.og-top{display:flex;justify-content:space-between;align-items:center}.og-sign{display:flex;align-items:center;gap:24px}.og-name{font-size:22px}.og-name span{display:block;font-size:13px;color:var(--muted);margin-top:4px}.og-photo{width:92px;height:92px;border-radius:50%;object-fit:cover}.og-main{font-size:82px;letter-spacing:-4px;line-height:1.04;font-weight:bold;margin-top:42px}.og-main span{color:var(--accent)}.og-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:42px;border-top:1px solid var(--line);padding-top:25px;font-size:17px;color:var(--muted)}.og-bottom b{color:var(--accent);font-weight:400}</style></head><body><div class="og-top"><div class="og-sign"><span class="monogram" aria-hidden="true">I<span class="letter-c" style="animation:none">C</span></span><div class="og-name">Igor de Castro<span>DESENVOLVEDOR & EMPREENDEDOR</span></div></div><img class="og-photo" src="../assets/igor.webp" alt="Igor de Castro"></div><p class="og-main">Seu negócio.<br><span>Software sob medida.</span></p><div class="og-bottom"><span>Sites · Sistemas · Automação & IA</span><b>Vamos conversar ↗</b></div><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get('tema')==='azul'?'azul':'verde';</script></body></html>
